<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirsad</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<script>
  // Apply saved theme + language before first paint (no flash)
  (function () {
    var get = function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
    var theme = get("mirsad.theme", "system");
    var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var lang = get("mirsad.lang", "en");
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  })();
</script>
<style>
:root {
  /* Light: the logo's cream paper, near-black ink and navy lettering */
  --bg: #F1EFE8; --sidebar: #E9E6DD; --surface: #FAF9F5; --surface-2: #E8E5DC; --hover: #E0DCD2;
  --border: #DBD7CC; --border-strong: #C5C0B4;
  --text: #16110D; --text-2: #57524A; --text-3: #8A857B;
  --accent: #111930; --accent-hover: #24304F; --accent-soft: #E1E3EA; --on-accent: #F3F3F1;
  --chart-1: #1E2B4F; --chart-2: #A3957C;
  --logo: url(/logo-light.png);
  --success: #2F7A45; --success-bg: #E2EEDF;
  --pro: #4B3FA6; --pro-bg: #E7E4F3;
  --danger: #A8321F; --danger-bg: #F5E1DB;
  --warning: #8A6200; --warning-bg: #F3E9CF;
  --shadow: 0 1px 2px rgba(22,17,13,.05), 0 4px 16px rgba(22,17,13,.07);
  --radius: 10px; --radius-lg: 16px;
  --font: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  /* Dark: the logo's charcoal background with its off-white mark */
  --bg: #1F1E1D; --sidebar: #181716; --surface: #292826; --surface-2: #252422; --hover: #32302D;
  --border: #363431; --border-strong: #4A4743;
  --text: #F3F3F1; --text-2: #B4B1A9; --text-3: #898579;
  --accent: #F3F3F1; --accent-hover: #FFFFFF; --accent-soft: #32302D; --on-accent: #1F1E1D;
  --chart-1: #E6E3DA; --chart-2: #8D9AC4;
  --logo: url(/logo-dark.png);
  --success: #6CCB8B; --success-bg: #1E3024;
  --pro: #ADA2F0; --pro-bg: #2A2740;
  --danger: #EE8C7D; --danger-bg: #3A2320;
  --warning: #E3B95B; --warning-bg: #352E1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[lang="ar"] { --font: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] svg.flip { transform: scaleX(-1); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- layout */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100vh; transition: grid-template-columns .2s ease; }
.app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.sidebar { background: var(--sidebar); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.app.collapsed .sidebar { border: 0; }
.sidebar-inner { width: 264px; display: flex; flex-direction: column; height: 100%; padding: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 600; font-size: 17px; }
.logo { display: inline-block; width: var(--s, 28px); height: var(--s, 28px); flex: none; background: var(--logo) center / contain no-repeat; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; color: var(--text); text-align: start; font-size: 14px; }
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--hover); font-weight: 500; }
.section-label { font-size: 12px; color: var(--text-3); padding: 18px 10px 6px; font-weight: 500; }
.recents { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.recent { position: relative; display: flex; align-items: center; }
.recent .nav-item { padding-inline-end: 34px; }
.recent .nav-item span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.recent .del { position: absolute; inset-inline-end: 6px; width: 26px; height: 26px; border-radius: 6px; display: none; align-items: center; justify-content: center; color: var(--text-3); }
.recent:hover .del { display: flex; }
.recent .del:hover { color: var(--danger); background: var(--surface); }
.recents-empty { font-size: 13px; color: var(--text-3); padding: 4px 10px; }
.user-wrap { position: relative; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.user { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 10px; text-align: start; }
.user:hover { background: var(--hover); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex: none; }
.user .name { font-size: 14px; font-weight: 500; line-height: 1.2; }
.user .plan { font-size: 12px; color: var(--text-3); }
.menu { position: absolute; bottom: calc(100% + 6px); inset-inline: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: none; z-index: 20; }
.menu.open { display: block; }
.menu-label { font-size: 12px; color: var(--text-3); margin: 4px 4px 6px; }
.seg { display: flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; margin-bottom: 8px; }
.seg button { flex: 1; white-space: nowrap; padding: 5px 8px; border-radius: 6px; font-size: 13px; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 4px; padding: 10px 14px; min-height: 56px; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.title { font-size: 17px; font-weight: 600; margin-inline-start: 6px; }
.spacer { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); margin-inline-end: 6px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.dot.live { background: var(--success); } .dot.mock { background: var(--warning); } .dot.down { background: var(--danger); }
.scrim { display: none; }

/* ---------- chat */
.view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.thread { flex: 1; overflow-y: auto; }
.thread-inner { max-width: 760px; margin: 0 auto; padding: 8px 20px 24px; }
.empty { text-align: center; padding: 8vh 0 12px; }

.empty h1 { font-size: 28px; font-weight: 600; margin: 16px 0 6px; letter-spacing: -.01em; }
.empty p { color: var(--text-2); margin: 0 auto 28px; max-width: 520px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: start; }
.card { display: flex; flex-direction: column; align-items: flex-start; text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.card .ic { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.card b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.card span { font-size: 13px; color: var(--text-2); line-height: 1.45; display: block; }
.tone-success { background: var(--success-bg); color: var(--success); }
.tone-pro { background: var(--pro-bg); color: var(--pro); }
.tone-danger { background: var(--danger-bg); color: var(--danger); }
.tone-warning { background: var(--warning-bg); color: var(--warning); }
.tone-neutral { background: var(--surface-2); color: var(--text-2); }

.msg { margin: 22px 0; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble { background: var(--surface-2); border-radius: 18px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.msg.bot { display: flex; gap: 12px; }
.msg.bot > .logo { margin-top: 1px; }
.bot-body { min-width: 0; flex: 1; }
.answer { word-wrap: break-word; }
.answer p { margin: 0 0 10px; } .answer p:last-child { margin-bottom: 0; }
.answer pre { background: var(--surface-2); padding: 12px; border-radius: 8px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.answer code { font: 13px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.answer pre code { background: none; padding: 0; }
.answer table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; }
.answer th, .answer td { border: 1px solid var(--border); padding: 6px 10px; text-align: start; }
.callout { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.callout b { display: block; font-weight: 600; }
.callout small { display: block; color: var(--text-2); font-size: 13px; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge svg.i { width: 14px; height: 14px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; max-width: 100%; }
.file-chip svg.i { width: 14px; height: 14px; }
.file-chip bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; align-items: center; gap: 2px; margin-top: 8px; margin-inline-start: -6px; flex-wrap: wrap; }
.act-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); }
.act-btn:hover { background: var(--hover); color: var(--text); }
.act-btn:focus-visible, .link:focus-visible, .btn:focus-visible, .reasons input:focus-visible + span, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.act-btn[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); }
.act-btn.ok { color: var(--success); }
.act-note { font-size: 12px; color: var(--text-3); margin-inline-start: 6px; }
.act-note.err { color: var(--danger); }
.fb-panel { margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; max-width: 520px; }
.fb-panel fieldset { border: 0; margin: 0 0 10px; padding: 0; }
.fb-panel legend { font-size: 13px; color: var(--text-2); padding: 0; margin-bottom: 6px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons label { cursor: pointer; }
.reasons input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.reasons span { display: inline-block; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); }
.reasons input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.fb-panel textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.fb-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.fb-q { white-space: pre-wrap; word-wrap: break-word; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-height: 180px; overflow: auto; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 14px; }
.dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); margin: 0 1px; animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.composer-wrap { padding: 8px 20px 18px; }
.composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); padding: 10px 10px 10px 18px; display: flex; align-items: flex-end; gap: 8px; }
[dir="rtl"] .composer { padding: 10px 18px 10px 10px; }
.composer:focus-within { border-color: var(--border-strong); }
.composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; max-height: 200px; padding: 7px 0; line-height: 1.5; }
.composer textarea::placeholder { color: var(--text-3); }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; flex: none; }
.send:hover { background: var(--accent-hover); }
.send:disabled { background: var(--border-strong); cursor: default; }
.hint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--text-3); }

/* ---------- dashboard */
.dash { flex: 1; overflow-y: auto; }
.dash-inner { max-width: 1100px; margin: 0 auto; padding: 4px 24px 40px; }
.dash-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.dash-head h1 { font-size: 24px; font-weight: 600; margin: 0; flex: 1; min-width: 180px; }
.dash-head .seg { margin: 0; }
select.sel { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.btn { font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.alert { border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.kpi .lbl { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 28px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; }
.kpi .sub { font-size: 12px; color: var(--text-3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; min-width: 0; }
.panel h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.chart-box { position: relative; height: 220px; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: start; color: var(--text-3); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td { padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td.wrap { white-space: normal; min-width: 220px; color: var(--text-2); }
table.data tr:last-child td { border-bottom: 0; }
details.tech { margin-top: 12px; }
details.tech > summary { cursor: pointer; font-weight: 500; color: var(--text-2); padding: 8px 0; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 6px 0 12px; }
.mini div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--text-2); }
.mini b { display: block; font-size: 18px; color: var(--text); font-weight: 600; }
.muted { color: var(--text-3); font-size: 13px; }

/* ---------- auth screens */
[hidden] { display: none !important; }
.auth-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.auth-top { position: fixed; top: 12px; inset-inline-end: 14px; display: flex; gap: 4px; }
.auth-card { width: 100%; max-width: 410px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 28px 22px; box-shadow: var(--shadow); }
.auth-card .logo { display: block; margin: 0 auto 14px; }
.auth-card h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; text-align: center; }
.auth-card .sub { color: var(--text-2); font-size: 14px; text-align: center; margin: 0 0 20px; }
.field { display: block; margin: 0 0 14px; }
.field > span { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 5px; }
.field input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--border-strong); }
.btn-primary { width: 100%; background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 11px; font-weight: 500; margin-top: 4px; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--border-strong); cursor: default; }
.auth-links { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 16px; }
.link { background: none; color: var(--text-2); font-size: 13px; text-decoration: underline; cursor: pointer; }
.link:hover { color: var(--text); }
.form-msg { border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
.setup-list { margin: 8px 0 0; padding-inline-start: 18px; font-family: var(--mono); font-size: 12px; }
.mail-ic { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
.mail-ic svg.i { width: 26px; height: 26px; }
.role-chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--text-2); }
.user .plan { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }

/* ---------- responsive */
@media (max-width: 860px) {
  .app, .app.collapsed { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 264px; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
  [dir="rtl"] .sidebar { transform: translateX(100%); }
  .app.mobile-open .sidebar { transform: none; }
  .app.mobile-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
  .cards, .kpis { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .status .txt { display: none; }
}
</style>
</head>

<div class="app" id="app" hidden>

      <div class="user-wrap">
        <div class="menu" id="user-menu" role="menu">

  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-sidebar" data-i18n-title="toggleSidebar" title="Toggle sidebar"><svg class="i flip"><use href="#i-sidebar"/></svg></button>
      <button class="icon-btn" id="btn-new" data-i18n-title="newChat" title="New chat"><svg class="i"><use href="#i-new"/></svg></button>

      <span class="spacer"></span>
      <span class="status" id="status"><span class="dot"></span><span class="txt">…</span></span>

          <button class="send" id="send" type="submit" data-i18n-title="send" title="Send" disabled><svg class="i"><use href="#i-send"/></svg></button>

    </section>

    <!-- Dashboard -->
    <section class="view" id="view-dash">
      <div class="dash"><div class="dash-inner">
        <div class="dash-head">
          <h1 id="dash-title">Monitoring</h1>
          <div class="seg" id="seg-window">
            <button data-min="15" data-i18n="w15">15 min</button>
            <button data-min="60" data-i18n="w60">1 hour</button>
            <button data-min="" class="on" data-i18n="wAll">All time</button>

            <option value="legacy" data-i18n="kLegacy">Legacy</option>
          </select>
          <button class="btn" id="btn-reset"><svg class="i"><use href="#i-refresh"/></svg><span data-i18n="reset">Reset data</span></button>
        </div>
        <div id="alerts"></div>
        <div id="dash-body"></div>
        <div id="fb-box"></div>
        <div id="admin-users"></div>
      </div></div>
    </section>
  </main>
</div>

    refreshActions(m, `[data-act="${rating === "helpful" ? "up" : "down"}"]`);

async function send(text) {
  text = (text || "").trim();
  if (!text || state.sending) return;
  let chat = currentChat();
  if (!chat) chat = state.draft = { id: null, title: text, messages: [], updated: Date.now() };
  if (!chat.messages) chat.messages = [];
  // The server loads the conversation history itself (from its own database); the browser sends only the new message.
  chat.messages.push({ role: "user", content: text }); chat.updated = Date.now();
  state.sending = true; state.sendingId = chat.id || "draft"; updateSendBtn();
  renderRecents(); renderThread();
  let reply;
  const r = await api("/api/chat", { method: "POST", body: { task: text, conversation_id: chat.id || undefined } });
  if (r.ok) {
    const d = r.data;
    reply = { role: "assistant", id: d.message_id, content: d.answer, status: d.status, files: d.files || [], feedback: null };
    if (!chat.id) {                                   // first message: the server created the conversation
      chat.id = d.conversation_id; chat.title = text.length > 48 ? text.slice(0, 48) + "…" : text;
      state.chats.unshift(chat); if (state.draft === chat) { state.draft = null; state.currentId = chat.id; }
    }
  } else {
    const msg = r.status === 429 && (r.data.error === "rate_limited") ? t("errRate") : r.status === 503 && r.data.error === "setup_error" ? t("errSetup") + " " + (r.data.missing || []).join(", ") : errMsg(r);
    reply = { role: "assistant", content: msg, status: "error", localText: true };
  }
  chat.messages.push(reply); chat.updated = Date.now();
  state.sending = false; state.sendingId = null; updateSendBtn();
  renderRecents(); if (currentChat() === chat) renderThread();
}

    <div class="panel"><h3>${esc(t("attempts"))}</h3><div class="table-wrap">${att.length ? `<table class="data"><thead><tr><th>${esc(t("tTime"))}</th><th>#</th><th>key</th><th>${esc(t("tModel"))}</th><th>outcome</th><th>HTTP</th><th>${esc(t("tLatency"))}</th></tr></thead><tbody>${att.map(a => `<tr><td>${esc(shortTime(a.time))}</td><td>${esc(a.attempt_no)}</td><td>${esc(a.credential_alias)}</td><td>${esc(String(a.model || "").split("/").pop())}</td><td>${esc(a.outcome)}</td><td>${esc(a.http_status ?? "")}</td><td>${ms(a.duration_ms)}</td></tr>`).join("")}</tbody></table>` : `<div class="muted">${esc(t("noAttempts"))}</div>`}</div></div>`;
}
function destroyCharts() { Object.values(charts).forEach(c => c && c.destroy()); charts = {}; }
function upsertChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  const key = id + "|" + resolvedTheme() + "|" + state.lang;
  const c = charts[id];
  if (c && c._mirsadKey === key) { c.data = cfg.data; c.update("none"); return; }
  if (c) c.destroy();
  charts[id] = new Chart(el, cfg); charts[id]._mirsadKey = key;
}
function renderCharts(d) {
  if (!window.Chart) return;
  const text2 = css("--text-2"), grid = css("--border"), accent = css("--chart-1"), pro = css("--chart-2"),
        success = css("--success"), danger = css("--danger"), warning = css("--warning"), muted = css("--text-3");
  Chart.defaults.color = text2; Chart.defaults.borderColor = grid;
  Chart.defaults.font.family = css("--font");
  const rtl = state.lang === "ar";
  const base = { responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { position: "bottom", rtl, labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } } },
    scales: { x: { reverse: rtl, grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid } } } };

  const cs = d.cost_series || [];
  upsertChart("ch-cost", { type: "line", options: { ...base, scales: { ...base.scales, y: { ...base.scales.y, ticks: { callback: v => money(v) } } } },
    data: { labels: cs.map(p => shortTime(p.time)), datasets: [
      { label: t("routed"), data: cs.map(p => p.actual_cost), borderColor: accent, backgroundColor: accent, tension: .3, pointRadius: 0, borderWidth: 2 },
      { label: t("baseline"), data: cs.map(p => p.baseline_cost), borderColor: muted, backgroundColor: muted, borderDash: [5, 4], tension: .3, pointRadius: 0, borderWidth: 2 } ] } });

  const rs = d.route_status || [], routes = ["simple", "complex"];
  const statusColors = { success, error: warning, blocked: danger };
  upsertChart("ch-route", { type: "bar", options: { ...base, scales: { x: { ...base.scales.x, stacked: true }, y: { ...base.scales.y, stacked: true, ticks: { precision: 0 } } } },
    data: { labels: routes.map(r => t(r)), datasets: ["success", "error", "blocked"].map(st => ({
      label: t(st === "blocked" ? "blockedS" : st), backgroundColor: statusColors[st], borderRadius: 4,
      data: routes.map(r => (rs.find(x => x.route === r && x.status === st) || {}).count || 0) })) } });

  const lat = d.latency_by_model || [];
  upsertChart("ch-lat", { type: "bar", options: base,
    data: { labels: lat.map(x => x.model), datasets: [
      { label: t("avg"), data: lat.map(x => Math.round(x.avg || 0)), backgroundColor: accent, borderRadius: 4 },
      { label: t("p95"), data: lat.map(x => Math.round(x.p95 || 0)), backgroundColor: pro, borderRadius: 4 } ] } });

  const tok = d.tokens_by_route || [];
  upsertChart("ch-tok", { type: "bar", options: base,
    data: { labels: tok.map(x => t(x.route)), datasets: [
      { label: t("input"), data: tok.map(x => x.input_tokens), backgroundColor: accent, borderRadius: 4 },
      { label: t("output"), data: tok.map(x => x.output_tokens), backgroundColor: success, borderRadius: 4 } ] } });
}

/* ================================================================ accounts: sign-in, sign-up, reset */
let healthTimer = null;
state.authMode = null; state.authData = {};
const mailIcon = tone => `<div class="mail-ic ${tone}">${icon("i-chat")}</div>`;
const field = (id, label, type, attrs = "") => `<label class="field"><span>${esc(label)}</span><input id="${id}" name="${id}" type="${type}" ${attrs} required></label>`;
const formMsg = (text, tone) => text ? `<div class="form-msg tone-${tone}" role="alert">${esc(text)}</div>` : "";
const logoBig = `<span class="logo" style="--s:64px" role="img" aria-label="Mirsad logo"></span>`;

function showAuth(mode, data = {}) {
  state.authMode = mode; state.authData = data;
  $("#app").hidden = true; $("#auth").hidden = false;
  renderAuth();
}
function renderAuth() {
  const mode = state.authMode; if (!mode) return;
  const d = state.authData, card = $("#auth-card"), em = d.email || "";
  const emailField = field("email", t("email"), "email", `autocomplete="username" dir="ltr" value="${esc(em)}"`);
  let html = "";
  if (mode === "setup") {
    html = `${logoBig}<h1>Mirsad</h1>${formMsg(t("errSetup"), "warning")}<ul class="setup-list">${(d.missing || []).map(m => `<li>${esc(m)}</li>`).join("")}</ul>`;
  } else if (mode === "processing") {
    html = `${logoBig}<h1>${esc(t("processing"))}</h1><div class="thinking" style="justify-content:center"><span class="dots"><span></span><span></span><span></span></span></div>`;
  } else if (mode === "signin") {
    html = `${logoBig}<h1>${esc(t("authTitleIn"))}</h1><p class="sub">${esc(t("authSubIn"))}</p>${formMsg(d.notice, "warning")}${formMsg(d.error, "danger")}
      <form id="f-signin" novalidate>${emailField}${field("password", t("password"), "password", 'autocomplete="current-password" dir="ltr"')}
      <button class="btn-primary" type="submit">${esc(t("signIn"))}</button></form>
      <div class="auth-links"><button class="link" data-go="forgot">${esc(t("forgot"))}</button><button class="link" data-go="signup">${esc(t("noAccount"))}</button></div>`;
  } else if (mode === "signup") {
    html = `${logoBig}<h1>${esc(t("authTitleUp"))}</h1><p class="sub">${esc(t("authSubUp"))}</p>${formMsg(d.error, "danger")}
      <form id="f-signup" novalidate>${field("name", t("name"), "text", `autocomplete="name" maxlength="80" dir="auto" value="${esc(d.name || "")}"`)}${emailField}
      ${field("password", t("password"), "password", 'autocomplete="new-password" minlength="8" dir="ltr"')}
      <button class="btn-primary" type="submit">${esc(t("signUp"))}</button></form>
      <div class="auth-links"><button class="link" data-go="signin">${esc(t("haveAccount"))}</button></div>`;
  } else if (mode === "forgot") {
    html = `${logoBig}<h1>${esc(t("authTitleForgot"))}</h1><p class="sub">${esc(t("authSubForgot"))}</p>${formMsg(d.error, "danger")}
      <form id="f-forgot" novalidate>${emailField}<button class="btn-primary" type="submit">${esc(t("sendLink"))}</button></form>
      <div class="auth-links"><button class="link" data-go="signin">${esc(t("backToSignIn"))}</button></div>`;
  } else if (mode === "check-signup" || mode === "check-reset") {
    const text = mode === "check-signup" ? t("checkEmailUp", em) : t("checkEmailReset");
    html = `${mailIcon("tone-success")}<h1>${esc(t("checkEmail"))}</h1><p class="sub" dir="auto">${esc(text)}</p>${formMsg(d.notice, "warning")}${formMsg(d.ok, "success")}
      <div class="auth-links">${mode === "check-signup" ? `<button class="link" data-resend="1">${esc(t("resend"))}</button>` : ""}<button class="link" data-go="signin">${esc(t("backToSignIn"))}</button></div>`;
  } else if (mode === "reset") {
    html = `${logoBig}<h1>${esc(t("authTitleReset"))}</h1><p class="sub">${esc(t("authSubReset"))}</p>${formMsg(d.error, "danger")}
      <form id="f-reset" novalidate>${field("password", t("newPassword"), "password", 'autocomplete="new-password" minlength="8" dir="ltr"')}
      ${field("password2", t("confirmPassword"), "password", 'autocomplete="new-password" minlength="8" dir="ltr"')}
      <button class="btn-primary" type="submit">${esc(t("savePassword"))}</button></form>
      ${d.fromApp ? `<div class="auth-links"><button class="link" data-cancel="1">${esc(state.lang === "ar" ? "رجوع" : "Cancel")}</button></div>` : ""}`;
  } else if (mode === "done") {
    html = `${mailIcon("tone-success")}<h1>${esc(t("passwordUpdated"))}</h1><button class="btn-primary" data-continue="1">OK</button>`;
  }
  card.innerHTML = html;
  const first = [...card.querySelectorAll("input")].find(i => !i.value);
  if (first) first.focus();
}
$("#auth-card").addEventListener("click", async e => {
  const go = e.target.closest("[data-go]"); if (go) { showAuth(go.dataset.go, { email: ($("#email") || {}).value || state.authData.email }); return; }
  if (e.target.closest("[data-cancel]")) { enterApp(); return; }
  if (e.target.closest("[data-continue]")) { await loadSession(); return; }
  if (e.target.closest("[data-resend]")) {
    const email = state.authData.email;
    const r = await api("/api/auth/resend", { method: "POST", body: { email } });
    showAuth("check-signup", { email, ok: r.ok ? t("resent") : null, notice: r.ok ? null : errMsg(r) });
  }
});
$("#auth-card").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, v = n => (f.elements[n] ? f.elements[n].value : ""), email = v("email").trim();
  const btn = f.querySelector("button[type=submit]"); if (btn) { btn.disabled = true; btn.textContent = t("sending"); }
  if (f.id === "f-signin") {
    const r = await api("/api/auth/login", { method: "POST", body: { email, password: v("password") } });
    if (r.ok) { await loadSession(); return; }
    if (r.data.error === "email_not_confirmed") { showAuth("check-signup", { email, notice: errMsg(r) }); return; }
    showAuth("signin", { email, error: errMsg(r) });
  } else if (f.id === "f-signup") {
    const name = v("name").trim(), pw = v("password");
    if (pw.length < 8) { showAuth("signup", { email, name, error: t("pwShort") }); return; }
    const r = await api("/api/auth/signup", { method: "POST", body: { name, email, password: pw } });
    if (r.ok && r.data.status === "confirmation_required") { showAuth("check-signup", { email }); return; }
    if (r.ok) { await loadSession(); return; }
    showAuth("signup", { email, name, error: errMsg(r) });
  } else if (f.id === "f-forgot") {
    const r = await api("/api/auth/recover", { method: "POST", body: { email } });
    if (r.ok) showAuth("check-reset", { email }); else showAuth("forgot", { email, error: errMsg(r) });
  } else if (f.id === "f-reset") {
    const pw = v("password"), pw2 = v("password2"), fromApp = state.authData.fromApp;
    if (pw.length < 8) { showAuth("reset", { fromApp, error: t("pwShort") }); return; }
    if (pw !== pw2) { showAuth("reset", { fromApp, error: t("pwMismatch") }); return; }
    const r = await api("/api/auth/password", { method: "POST", body: { password: pw } });
    if (r.ok) showAuth("done"); else showAuth("reset", { fromApp, error: errMsg(r) });
  }
});

function takeFragment() {
  // Email links return tokens in the URL fragment (#...). Browsers never send fragments to the server, so they
  // cannot appear in server logs. Read them once, remove them from the address bar immediately, then post them to the
  // server, which verifies them with Supabase. They are never stored in the browser.
  const raw = location.hash.replace(/^#/, ""); if (!raw) return null;
  const p = new URLSearchParams(raw);
  const out = { access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), token_hash: p.get("token_hash"),
                type: p.get("type"), error: p.get("error") || p.get("error_code") };
  if (!(out.access_token || out.token_hash || out.error)) return null;
  history.replaceState(null, "", location.pathname === "/auth/callback" ? "/" : location.pathname + location.search);
  return out;
}
async function completeCallback(f) {
  if (f.error || !(f.token_hash || (f.access_token && f.refresh_token))) { showAuth("signin", { error: t("linkInvalid") }); return; }
  showAuth("processing");
  const body = f.token_hash ? { token_hash: f.token_hash, type: f.type || "signup" } : { access_token: f.access_token, refresh_token: f.refresh_token, type: f.type || "signup" };
  const r = await api("/api/auth/callback", { method: "POST", body });
  if (r.ok) await loadSession(); else showAuth("signin", { error: errMsg(r) });
}
async function loadSession() {
  const r = await api("/api/auth/session");
  const s = r.data || {};
  if (s.setup_error) { showAuth("setup", { missing: s.setup_error }); return; }
  if (!s.authenticated) { state.user = null; csrf = null; showAuth("signin", state.authMode === "signin" ? state.authData : {}); return; }
  csrf = s.csrf_token; state.user = s.user;
  if (s.recovery) { showAuth("reset", {}); return; }          // opened from a reset link: a new password comes first
  await enterApp();
}
function renderUserBox() {
  if (!state.user) return;
  const nm = state.user.name || state.user.email || "?";
  $("#user-avatar").textContent = nm.trim().charAt(0).toUpperCase();
  $("#user-name").textContent = nm;
  $("#user-role").textContent = (isAdmin() ? t("roleAdmin") + " · " : "") + (state.user.email || "");
}
async function enterApp() {
  state.authMode = null; $("#auth").hidden = true; $("#app").hidden = false;
  state.chats = []; state.draft = null; state.currentId = null;
  renderUserBox();
  $("#nav-dash").hidden = !isAdmin();
  await loadConversations();
  showView("chat"); renderThread();
  loadHealth(); clearInterval(healthTimer); healthTimer = setInterval(loadHealth, 15000);
}
function clearSessionState() {
  state.user = null; csrf = null; state.chats = []; state.draft = null; state.currentId = null; state.health = null;
  epoch++;                                     // replies still in flight for the previous sign-in are ignored
  lastMetrics = null; clearTimeout(pollTimer); clearInterval(healthTimer); destroyCharts();
  fbState.data = null; fbState.sig = ""; fbState.detailId = null; fbState.detail = null; fbState.rating = ""; fbState.reason = "";
  $("#thread-inner").innerHTML = ""; $("#dash-body").innerHTML = ""; $("#admin-users").innerHTML = ""; $("#fb-box").innerHTML = "";
}
function onSessionLost() { clearSessionState(); showAuth("signin", { notice: t("sessionExpired") }); }
async function logout() {
  await api("/api/auth/logout", { method: "POST" });
  clearSessionState(); showAuth("signin", {});
}

/* ================================================================ events */
$("#btn-sidebar").onclick = toggleSidebar;
$("#scrim").onclick = closeMobileSidebar;
$("#btn-new").onclick = newChat;
$("#nav-new").onclick = newChat;
$("#nav-dash").onclick = () => showView("dash");
$("#btn-lang").onclick = () => setLang(state.lang === "ar" ? "en" : "ar");
$("#btn-theme").onclick = () => setTheme(resolvedTheme() === "dark" ? "light" : "dark");
$("#user-btn").onclick = e => { e.stopPropagation(); $("#user-menu").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest(".user-wrap")) $("#user-menu").classList.remove("open"); });
$("#seg-lang").onclick = e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.lang); };
$("#seg-theme").onclick = e => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.theme); };
$("#recents").onclick = e => {
  const del = e.target.closest("[data-del]"); if (del) { deleteChat(del.dataset.del); return; }
  const open = e.target.closest("[data-open]"); if (open) openChat(open.dataset.open);
};
$("#thread-inner").onclick = e => { const c = e.target.closest("[data-scenario]"); if (c) send(SCENARIOS[+c.dataset.scenario].task); };
const input = $("#input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; updateSendBtn(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
$("#composer").onsubmit = e => { e.preventDefault(); const v = input.value; input.value = ""; input.style.height = "auto"; updateSendBtn(); send(v); };
$("#seg-window").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#seg-window button").forEach(x => x.classList.toggle("on", x === b));
  state.minutes = b.dataset.min; loadMetrics();
};
$("#sel-kind").onchange = e => { state.kind = e.target.value; loadMetrics(); };
$("#btn-reset").onclick = async () => {
  if (!isAdmin() || !confirm(t("resetConfirm"))) return;
  await api("/api/admin/reset", { method: "POST" });
  destroyCharts(); $("#dash-body").innerHTML = ""; loadMetrics();
};
$("#btn-logout").onclick = logout;
$("#btn-changepw").onclick = () => { $("#user-menu").classList.remove("open"); showAuth("reset", { fromApp: true }); };
$("#auth-lang").onclick = () => setLang(state.lang === "ar" ? "en" : "ar");
$("#auth-theme").onclick = () => setTheme(resolvedTheme() === "dark" ? "light" : "dark");

/* ================================================================ start */
if (store.get("mirsad.sidebarCollapsed", false) && !isMobile()) $("#app").classList.add("collapsed");
(async function boot() {
  const frag = takeFragment();               // first thing: pull any email-link tokens out of the address bar
  applyTheme(); applyLang();
  if (frag) await completeCallback(frag); else await loadSession();
})();
</script>
